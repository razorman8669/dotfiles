# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Which is equivalent to
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$deno\
$golang\
$nodejs\
$python\
$rust\
$swift\
$cmd_duration\
$line_break\
$time\
$username\
$os\
$hostname\
$status\
$character"""

command_timeout = 1_000

[directory]
fish_style_pwd_dir_length = 1
truncation_length = 4
style = 'bold cyan'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'green'

[cmd_duration]
min_time = 1_000
format = '\[[$duration](bold yellow)\]'
style = 'yellow'

[time]
disabled = true
format = '[$time]($style) '
style = 'white'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'yellow'

[hostname]
ssh_only = false
format = '[$hostname]($style) '
style = 'blue'

[os]
disabled = false
style = 'bold blue'
format = '[$symbol]($style)'

[os.symbols]
Arch = ''
Macos = ''

Ubuntu = ''
Debian = ''
Linux = ''

[deno]
format = '[$symbol($version )]($style)'

[golang]
format = '[$symbol($version )]($style)'

[nodejs]
format = '[$symbol($version )]($style)'
style = 'green'

[rust]
format = '[$symbol($version )]($style)'
style = 'red'

[python]
format = '[$symbol($version )]($style)'

[swift]
format = '[$symbol($version )]($style)'
